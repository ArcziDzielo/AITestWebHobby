<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hobby Blog — Post</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand"><a href="index.html">Hobby Blog</a></h1>
    </div>
  </header>
  <main class="wrap">
    <article id="post" class="post-article"></article>
  </main>
  <footer class="site-footer">
    <div class="wrap"><small>© Hobby Blog</small></div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "REPLACE_API_KEY",
      authDomain: "REPLACE_AUTH_DOMAIN",
      projectId: "REPLACE_PROJECT_ID",
      storageBucket: "REPLACE_STORAGE_BUCKET",
      messagingSenderId: "REPLACE_MESSAGING_SENDER_ID",
      appId: "REPLACE_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  <script>
  (async function(){
    function qs(key){ const p=new URLSearchParams(location.search); return p.get(key); }
    const slug = qs('slug');
    const postEl = document.getElementById('post');
    if(!slug){ postEl.innerHTML = '<p>Brak posta do wyświetlenia.</p>'; return; }
    try{
      const q = await db.collection('posts').where('slug','==',slug).where('published','==',true).limit(1).get();
      if(q.empty){ postEl.innerHTML = '<p>Nie znaleziono posta.</p>'; return; }
      const doc = q.docs[0].data();
      postEl.innerHTML = `<h2 class="post-title">${doc.title}</h2>
        ${doc.coverUrl?`<img class="post-cover" src="${doc.coverUrl}" alt="">`:''}
        <div class="post-meta">Opublikowano: ${new Date(doc.createdAt?.seconds*1000 || Date.now()).toLocaleDateString()}</div>
        <div class="post-body">${doc.html}</div>`;
    }catch(e){ postEl.innerHTML = '<p>Błąd ładowania posta.</p>'; }
  })();
  </script>
</body>
</html>
