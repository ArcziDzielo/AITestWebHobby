<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hobby Blog</title>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#FFD54A">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand">Hobby Blog</h1>
      <p class="tagline">Pomysły, przepisy i inspiracje — żółto i radośnie.</p>
    </div>
  </header>

  <main class="wrap">
    <section id="posts" class="posts-grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <small>© Hobby Blog — wszystkie prawa zastrzeżone</small>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "REPLACE_API_KEY",
      authDomain: "REPLACE_AUTH_DOMAIN",
      projectId: "REPLACE_PROJECT_ID",
      storageBucket: "REPLACE_STORAGE_BUCKET",
      messagingSenderId: "REPLACE_MESSAGING_SENDER_ID",
      appId: "REPLACE_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
