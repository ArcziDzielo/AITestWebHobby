# PHP Configuration for Professional Blog
# Add these settings to your php.ini or create .user.ini file

upload_max_filesize = 10M
post_max_size = 10M
memory_limit = 128M
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

# Security
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

# Session
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

# JSON
json.serialize_precision = -1

# Date
date.timezone = "Europe/Warsaw"

# File uploads
file_uploads = On
upload_tmp_dir = /tmp
